[project]
name = "vamos"
version = "0.1.0"
description = "Virtual All-sky Meteor Observation Simulator"
requires-python = ">=3.14"
dependencies = [
    "argparsedirs>=0.2.1",  # was undeclared: render.py uses it for its output directory
    "astropy>=8.0.1",
    "demeteor>=0.2.4",      # was amosutils, which this is the renamed continuation of
    "demetria>=0.1.0",      # 2D fields, and the Zernike polynomials a distortion is built from
    "dotmap>=1.3.30",       # was undeclared: render.py reads the camera config through one
    "enschema>=0.1.5",
    "matplotlib>=3.11.1",
    "numpy>=2.5.1",
    "pandas>=3.0.5",
    "pillow>=10.0",         # was undeclared: render.py and frame.py both `from PIL import Image`
    "pyyaml>=6.0.3",
    "scalyca>=0.2.7",
    "scipy>=1.18.0",
]

[dependency-groups]
dev = [
    "ipython>=9.15.0",
    "pytest>=9.1.1",
]
