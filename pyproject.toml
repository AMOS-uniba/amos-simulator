[project]
name = "vamos"
version = "0.1.1"
description = "Virtual All-sky Meteor Observation Simulator"
requires-python = ">=3.12"
# Everything from PyPI. The Pipfile this replaces installed amosutils and scalyca as editable
# local paths, and amosutils has since been renamed demeteor and its directory emptied -- so vamos
# could not be installed at all, let alone run.
dependencies = [
    "argparsedirs>=0.2.1",
    "astropy>=7.0",
    "demeteor>=0.2.2",      # was amosutils: the projections, the catalogue and the metrics
    "demetria>=0.1.0",      # 2D fields, and the Zernike polynomials a distortion is built from
    "dotmap>=1.3.30",
    "enschema>=0.1.5",
    "matplotlib>=3.9",
    "numpy>=2.0",
    "pandas>=2.2",
    "pillow>=10.0",         # was undeclared: render.py and frame.py both `from PIL import Image`
    "ruamel-yaml>=0.19.1",  # YAML 1.2, as the rest of the ecosystem now reads
    "scalyca>=0.2.7",
    "scipy>=1.14",
]

[dependency-groups]
dev = [
    "ipython",
    "pytest>=8.0",
]

[tool.ruff]
line-length = 120
