#
# Starts at 17:25 UT on 2025-10-01, when the Sun is ten degrees down -- so the first frames are
# nautical twilight, which an intensified camera meets by turning its gain to the floor and washing
# out anyway, as a station's do. The Moon is 15 degrees up and 68% lit at the start, sets in the
# west-south-west at 22:20, and the last three hours are a moonless sky.
#
# One frame every two minutes for 240 of them, which is eight hours; at thirty frames a second that
