# A night with nothing in it but the sky.
#
# No meteor, one frame every ten minutes, from the end of twilight until the Moon sets. On
# 2025-10-01 from AGO the Moon is above the horizon from 14:30 to 22:20 UT and the Sun is more than
# twelve degrees down from 17:40, which leaves four hours and forty minutes: the Moon starts due
# south at its highest, 16.0 degrees, and slides down to the west-south-west horizon.
#
# It never gets high that night -- a gibbous Moon 111 degrees from the Sun, low in the south. For a
# steep arc across the middle of the frame, pick a first-quarter Moon in winter instead.
