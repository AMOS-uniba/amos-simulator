# The same camera as default.yaml, sampled once every ten minutes instead of twenty times a
# second. Everything about the optics, the detector and the PSF is identical, so a frame here
# looks exactly like a frame there -- there are simply ten minutes between them.
pixels:
  x0: 799.5                 # Origin x
  y0: 599.5                 # Origin y
  xs: 4.4                   # Pixel width in µm
  ys: 4.4                   # Pixel height in µm

# The lens, and what reaches the photocathode through it. Together with the exposure below, these
# four numbers are what `Scene.gain = 1e13` used to stand in for: a flux in W/m2 becomes a number of
# photoelectrons, and every noise term further down is then in electrons and can be argued about.
optics:
  aperture: 4.3             # Entrance pupil diameter [mm]: a 6 mm fisheye at f/1.4
  qe: 0.20                  # Photocathode quantum efficiency at the effective wavelength
  wavelength: 550           # Effective wavelength [nm], which sets the energy per photon

detector:
  xres: 1600
  yres: 1200
  # The frame, and how much of it the shutter is open for. 20 frames a second, and an exposure a
  # little shorter than the interval, as a real camera has.
  # Two minutes between frames rather than a frame rate: see `interval` in render.py. 240 of them
  # covers eight hours, and at thirty frames a second that is eight seconds of video.
  interval: 120             # [s] between frames
  # Three tenths of a second, where default.yaml has 40 ms. Nothing here moves fast enough to care --
  # stars trail 0.01 px, the Moon 0.15 arcseconds -- so the exposure is free to set how grainy a frame
  # is, and it is the honest knob for it: the graininess of a photon-starved frame *is* its photon
  # statistics. Shot noise goes as one over the root of the photons collected, so this is a third of
  # the grain of 40 ms and half again the grain of a full second.
  exposure: 0.3             # [s]
  # Everything below is in electrons, which is the only place the numbers can be compared with a
  # datasheet. dark is a rate, so it scales with the exposure; read_noise and bias do not.
  # Photocathode thermionic emission, and the readout behind the intensifier. `dark` and `glow` are
  # rates at the photocathode, so they are photoelectrons and get amplified with the signal;
  # `read_noise` and `bias` are at the output, after the gain, which is why they are large numbers
  # and why they matter so little. This is the point of an intensifier: one photoelectron leaves the
  # readout far above its noise, so the frame is photon-starved rather than read-noise limited.
  dark: 5                   # [e-/s/pixel] at the photocathode
  read_noise: 100           # [e- rms] at the output
  bias: 300                 # [e-] at the output, the pedestal a readout sits on
  full_well: 128000         # [e-] at the output: about thirteen photoelectrons, so it saturates easily
  bits: 8                   # Output depth; the video and Kvant both want 8
  # The AMOS intensifier: a multiplicative stage with noise of its own. `gain` multiplies the signal,
  # `excess_noise` is the factor by which its variance exceeds Poisson -- around two for an MCP -- and
  # `glow` is the haze it adds in the middle of the field, falling off over `glow_radius` pixels.
  #
  # gain and full_well only ever appear as a ratio: with these two, one photoelectron is twenty of
  # the 255 counts, which puts a dark zenith sky near twenty-five and leaves a V=6 star visible above
  # it. Those are the numbers to turn when a rendered frame is to be matched against a real one.
  intensifier:
    # `auto`, because no fixed number can cover this run. At twelve degrees of solar depression the
    # sunward horizon is two hundred times a dark sky and the anti-solar horizon still fifteen times,
    # which does not fit in 255 counts alongside a usable night: a gain that suits the dark sky turns
    # the first frame white, and one that survives the first frame leaves the night at 18 counts with
    # 44% of that frame clipped anyway.
    #
    # A real intensified camera does not choose either -- the tube is driven by a loop that turns
    # itself down as the sky brightens, which is how a station keeps working through twilight. Here
    # that lands on gain 123 at -12 and 20000 by the middle of the night, and it runs out of range
    # around -9, where a station really cannot observe. The frames are then *not* photometric: two of
    # them an hour apart were taken at different gains. That is true of the hardware too, and it is
    # why default.yaml pins the gain, the brightness of a meteor being the measurement there.
    gain: auto
    # 30 rather than 60: the sky sits lower in the range, which doubles the room a star has before
    # it clips. That is what pays for the narrower core above -- concentrating the same light into
    # fewer pixels would otherwise saturate stars three quarters of a magnitude fainter.
    agc_target: 30            # counts at `agc_percentile` of the frame
    agc_percentile: 90        # so a bright rim sets it, not a few saturated stars
    agc_min: 50               # the range a tube can be driven over
    agc_max: 20000
    excess_noise: 2.0
    glow: 60                # [e-/s/pixel] at the photocathode, at the centre of the field
    glow_radius: 100        # [pixels]

# How a point source lands on the sensor: the full width at half maximum in the middle of the field
# and at the edge of the circle, in pixels, interpolated linearly in radius. At these field angles a
# real all-sky lens is soft towards the rim and that is all this says. Do not go below about 2:
# anything narrower puts a faint star inside one pixel, where the pixel grid decides its centroid.
psf:
  # A narrow core and a faint broad halo, which is what a star looks like through real optics. One
  # Gaussian has to be widened until its skirts look right and then every star is hazy; splitting
  # them lets the core go near the sampling limit while the light a lens scatters stays in the glow.
  #
  # Do not take the core below about 1.7: under that the profile is undersampled and a centroid
  # starts depending on where inside a pixel the star fell, which is a systematic and not noise.
  fwhm_centre: 1.8
  fwhm_edge: 2.2
  halo_fraction: 0.03       # of the light, in the wing
  halo_fwhm: 12
  # The wing is a Moffat, `(1 + r^2/a^2)^-beta`, and beta is what makes a bloom a bloom: a power law
  # at fifty pixels is 2.5e-4 of its peak where a Gaussian is 1e-21. Lower it for more glow -- 1.5
  # gives the Moon a 73 px core and a 400 px glow, 2.2 gives 59 and 221.
  halo_beta: 1.8
  halo_max: 200             # [px] where to stop drawing it; a power law has no natural end

# How many times inside one exposure the meteor is drawn. It moves tens of pixels while the shutter
# is open, so one sample per frame renders a dot where a real camera records a streak. The stars and
# the sky are built once, at mid-exposure: they move well under a pixel in 40 ms.
# One sample per exposure: there is no meteor to smear, and the stars move 0.6 arcseconds in 40 ms.
subsamples: 1

# The trail behind a meteor. What is back there is not the meteoroid but the air and vapour it left
# excited, so light emitted at one instant stays at the position the meteoroid had then and fades from
# there -- an exponential memory rather than a string of copies.
#
# `fraction` is how much of the light lingers that way. The rest is prompt: radiated by the meteoroid
# and gone, so it appears only where the head was while the shutter was open. Make it all memory and
# the trail carries as much light as the head and looks painted on; 0.15 leaves a bright head with a
# tapering wake, which is what a fireball looks like. `decay` is how long that fraction takes to fade.
#
# Physically the meteor's, not the camera's, but this is the file where a flight becomes frames.
wake:
  fraction: 0.15
  decay: 0.05               # [s]

padding:
  start: 0
  end: 0

# What the atmosphere is like. `extinction` is magnitudes lost per air mass at the zenith in V --
# 0.145 is a clear night at a few hundred metres; 0.25 is haze. It attenuates the stars and the
# meteor, and it is also what dims the atmosphere's own light on its way out, so one number does
# both jobs.
sky:
  extinction: 0.145
  # The airglow layer: how bright the sky is at the zenith, in magnitudes per square arcsecond, and
  # where the layer lives. 21.8 is a dark rural sky, 20.5 a village, 18 a city; the height is the
  # mesopause and sets how much brighter the horizon is than the zenith -- about six times the path,
  # before extinction takes most of it back. It used to read `intensity: 100`, in no unit at all,
  # which was a number tuned against a gain of 1e13 rather than anything measurable.
  airglow:
    brightness: 21.8
    height: 90
  moon: true
  # Twilight. Its shape and its fall-off are geometry -- how high the Earth's shadow stands on each
  # line of sight, and how little air is left above that -- so there is only one number to set:
  # `brightness`, the surface brightness of the sunward horizon at sunset, in mag/arcsec2. It puts
  # the zenith at 19.5 when the Sun is twelve degrees down and 25.4 -- invisible -- at eighteen,
  # which is astronomical twilight ending where it should. `multiple_scattering` is the diffuse floor
  # of light that has bounced more than once, as a fraction of the sunward horizon's direct term, and
  # it sets the horizon-to-zenith contrast. **Neither is measured**: fit them against Patat et al.
  # (2006) or a real frame. The fall-off with depression is not fitted at all -- it comes out of the
  # shadow geometry at 0.97 mag per degree. See effects/sky.py:Sunlight.
  twilight:
    brightness: 9.7
    multiple_scattering: 0.4
  # On: the run starts at the end of nautical twilight, so the first frames show it fade.
  sun: true
